name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, docs, and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check feature combinations
        run: cargo hack check --locked -p xorf --feature-powerset --depth 2 --lib

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p xorf --all-features --no-deps

      - name: Verify the publishable package
        run: cargo package --locked -p xorf

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: no default features
            args: --no-default-features
          - name: all features
            args: --all-features
          - name: no_std-compatible features
            args: --no-default-features --features binary-fuse,serde
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked -p xorf ${{ matrix.args }}

  msrv:
    name: Minimum supported Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Check the complete library API
        run: cargo check --locked -p xorf --lib --all-features

  no-std:
    name: no_std + alloc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable Rust and an embedded target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Check without default features
        run: cargo check --locked -p xorf --target thumbv7em-none-eabi --no-default-features

      - name: Check all no_std-compatible features
        run: >-
          cargo check --locked -p xorf --target thumbv7em-none-eabi
          --no-default-features --features binary-fuse,serde

  semver:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Check against the latest crates.io release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: xorf
          feature-group: all-features

  future-rust:
    name: Future Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Check the workspace
        run: cargo check --locked --workspace --all-features
