name: Continuous Deployment

on:
  push:
    tags: ["*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publish release
    if: github.repository == 'ayazhafiz/xorf'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches the package version
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xorf") | .version')"
          if [[ "$release_tag" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match xorf $package_version" >&2
            exit 1
          fi

      - name: Test the release
        run: cargo test --locked -p xorf --all-features

      - name: Verify the crates.io package
        run: cargo publish --locked -p xorf --dry-run

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish to crates.io
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked -p xorf
